<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>Gelar Karya UP60</title>
    <link
      rel="icon"
      type="image/png"
      href="assets/img/logo-dies-natalis-60.png"
    />
    <link rel="apple-touch-icon" href="assets/img/logo-dies-natalis-60.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="hero">
      <div class="wrap">
        <img
          src="https://lh3.googleusercontent.com/d/1-bUeaGic7PcI6EGz7-OlFdL4M82DOuOQ"
          alt="Logo Dies Natalis ke-60 Universitas Pancasila"
          width="132"
          height="125"
        />
        <div>
          <p class="eyebrow">Gelar Karya Penelitian dan PKM</p>
          <h1>60 Tahun UP: Berakar Pancasila, Berkarya Untuk Bangsa</h1>
          <p class="hero-date">
            Senin, 19 Okt 2026 · 08.00–16.00 WIB · Aula Masjid At-Taqwa UP
          </p>
        </div>
        <div class="stats" id="stats"></div>
      </div>
    </header>

    <main class="wrap" id="main">
      <section id="v-beranda" data-view="beranda"></section>
      <section id="v-jelajah" data-view="jelajah" hidden></section>
      <section id="v-sdgs" data-view="sdgs" hidden></section>
      <section id="v-denah" data-view="denah" hidden></section>
      <section id="v-rute" data-view="rute" hidden></section>
      <section id="v-umpan" data-view="umpan" hidden></section>
      <section id="v-hadir" data-view="hadir" hidden></section>
      <section id="v-qrbooth" data-view="qrbooth" hidden></section>
      <section id="v-pengundian" data-view="pengundian" hidden></section>
      <footer class="site-footer">
        <div class="footer-brand">
          <b>Gelar Karya Penelitian & PKM 2026</b>
          <span>Dies Natalis ke-60 Universitas Pancasila</span>
        </div>
        <p class="footer-tagline">Berakar Pancasila, Berkarya untuk Bangsa</p>
      </footer>
    </main>

    <canvas id="confettiCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>
    <nav class="tabs" id="tabs" aria-label="Navigasi utama"></nav>
    <div id="layer"></div>
    <div id="scanlayer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="assets/js/jsqr.min.js"></script>
    <script src="assets/js/denah-svg.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
